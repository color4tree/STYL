# Install as /etc/systemd/system/caddy.service.d/website-logs.conf.
# Keep the vendor's Type=notify and grant notification access to its child.
[Service]
NotifyAccess=all
SupplementaryGroups=styl-logs
UMask=0027
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/lib/styl/capture_website_logs.py --directory /var/log/styl-website --prefix caddy -- /usr/bin/caddy run --config /etc/caddy/Caddyfile
ExecReload=
ExecReload=/usr/bin/python3 /usr/local/lib/styl/capture_website_logs.py --directory /var/log/styl-website --prefix caddy-reload -- /usr/bin/caddy reload --config /etc/caddy/Caddyfile --force
KillMode=mixed
TimeoutStopSec=45
Restart=on-failure
RestartPreventExitStatus=74
RestartSec=5
StandardOutput=journal
StandardError=journal
ReadWritePaths=/var/log/styl-website
